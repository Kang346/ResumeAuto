<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../shared/tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">AutoResume</span>
    </div>
    <div class="topbar-actions">
      <button id="btn-save" class="icon-btn" type="button" aria-label="Save this job" title="Save this job for later">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <use href="../shared/icons.svg#i-bookmark"/>
        </svg>
      </button>
      <span id="server-status" class="server-dot" data-state="checking" role="status" aria-label="Server status: checking"></span>
    </div>
  </header>

  <main class="state-host" id="state-host" aria-live="polite"></main>

  <details class="more" id="more">
    <summary>
      <span class="more-label">More options</span>
      <svg class="icon icon-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <use href="../shared/icons.svg#i-chevron-down"/>
      </svg>
    </summary>
    <div class="more-body">
      <section class="more-section">
        <label for="pdf-select" class="kbd">pdf manual inject</label>
        <div class="pdf-row">
          <select id="pdf-select" class="select"><option value="">loading</option></select>
          <button id="btn-inject" class="btn btn-ghost" type="button">Inject</button>
        </div>
      </section>
      <section class="more-section" id="agent-section" hidden>
        <span class="kbd">drafts</span>
        <div id="agent-q-list" class="agent-list"></div>
        <button id="btn-agent-fill" class="btn btn-ghost" type="button" hidden>Fill drafted answers</button>
      </section>
      <section class="more-section" id="hidden-hosts-section" hidden>
        <span class="kbd">hidden on</span>
        <ul id="hidden-hosts-list" class="hidden-hosts"></ul>
      </section>
    </div>
  </details>

  <p id="toast" class="toast" role="status" aria-live="polite"></p>

  <script src="popup.js"></script>
</body>
</html>
